[package]
name = "mibl"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nucleo-matcher = "0.3.1"
clap = { version = "4", default-features = false, features = ["std", "usage", "error-context", "help", "suggestions"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
unicode-width = "0.2.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
shell-words = "1.1.1"

[dev-dependencies]
libc = "0.2.189"
